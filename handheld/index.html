<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091423"><title>TrailBlazer OS 0.1</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e9f5ff;background:#07111e}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#173450,#07111e 62%)}main{max-width:480px;margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 20px 32px}.top{display:flex;justify-content:space-between;color:#80dffa;font-size:12px;letter-spacing:2px}.hero{text-align:center;padding:68px 0 42px}.mount{font-size:44px}.hero h1{font-size:30px;letter-spacing:3px;margin:8px 0}.hero p{color:#8ba7bd;font-size:12px;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}button{font:inherit;color:inherit;cursor:pointer}.tile{border:1px solid #30506b;background:#172d42;border-radius:18px;min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:13px;letter-spacing:1px}.tile span{font-size:30px}.tile:focus-visible{outline:3px solid #80dffa}.status{display:flex;justify-content:space-between;color:#80dffa;font-size:11px;margin-top:36px}dialog{background:#13283b;color:white;border:1px solid #5688a4;border-radius:18px;width:min(90vw,440px);padding:22px}dialog::backdrop{background:#000a}dialog button{background:#2a5673;border:0;border-radius:10px;padding:12px}#preview{max-width:100%;max-height:220px;display:block;margin:14px auto}input[type=file]{max-width:100%}small{color:#a6c0d2}a{color:#80dffa}#log{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><main><div class="top"><strong>TB / DEVICE 001</strong><span id="clock">--:--</span></div><div class="hero"><div class="mount">⛰</div><h1>TRAILBLAZER</h1><p>ENGINEERING OS / 0.1</p></div><div class="grid"><button class="tile" data-action="camera"><span>📷</span>CAMERA</button><button class="tile" data-action="media"><span>🖼️</span>MEDIA</button><button class="tile" data-action="bill"><span>🤖</span>BILL AI</button><button class="tile" data-action="lab"><span>🛠️</span>THE LAB</button><button class="tile" data-action="files"><span>📁</span>FILES</button><button class="tile" data-action="system"><span>⚙️</span>SYSTEM</button></div><div class="status"><span>TRAILBLAZER LAB</span><span>PROTOTYPE ONLINE</span></div></main><dialog id="panel"><h2 id="heading"></h2><div id="content"></div><p><button id="close">Close</button></p></dialog><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><input id="mediaInput" type="file" accept="image/*" multiple hidden><input id="filesInput" type="file" multiple hidden><script>
const $=id=>document.getElementById(id),panel=$('panel');$('close').onclick=()=>panel.close();function show(title,html){$('heading').textContent=title;$('content').innerHTML=html;panel.showModal()}function clock(){ $('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}clock();setInterval(clock,30000);function selected(input){const files=[...input.files];if(!files.length)return;const file=files[0];show('Selected file',`<p id="filename"></p><img id="preview" alt="Selected image preview"><p><button id="share" type="button">Share selected file</button></p><small>Files are not uploaded or stored by this prototype.</small>`);$('filename').textContent=`${files.length} selected: ${file.name}`;if(file.type.startsWith('image/')){const url=URL.createObjectURL(file);$('preview').src=url;$('preview').onload=()=>URL.revokeObjectURL(url)}else $('preview').hidden=true;$('share').onclick=async()=>{try{if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'TrailBlazer media'});else show('Sharing unavailable','<p>This browser cannot share the selected file. Use the device file manager instead.</p>')}catch(e){if(e.name!=='AbortError')show('Sharing error','<p>Could not open sharing on this device.</p>')}}}for(const id of ['cameraInput','mediaInput','filesInput'])$(id).addEventListener('change',e=>selected(e.target));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{switch(b.dataset.action){case 'camera':$('cameraInput').click();break;case 'media':$('mediaInput').click();break;case 'files':$('filesInput').click();break;case 'bill':show('Bill AI','<p>Bill AI integration is planned. For now, open <a href="https://chatgpt.com" target="_blank" rel="noopener">ChatGPT</a> outside kiosk mode.</p>');break;case 'lab':show('The Lab','<p>Printer status, projects, and engineering tools will appear here after we build a secure local service.</p>');break;case 'system':show('System','<p>TrailBlazer OS UI v0.1</p><p id="agent"></p><small>This is a web prototype, not an installed Linux operating system.</small>');$('agent').textContent=navigator.userAgent;break;}});
</script></body></html>
