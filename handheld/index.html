<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071321"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>TrailBlazer OS • Bill AI</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 25%,#173752,#071321 65%);color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;min-height:100dvh}main{max-width:540px;margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 25px)}header,footer{display:flex;justify-content:space-between;color:#8cdaef;font-size:12px;letter-spacing:2px}.center{text-align:center;padding:9vh 0 5vh}.orb{margin:0 auto 25px;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#39b9e8,#13527c 50%,#0c2942 70%);box-shadow:0 0 45px #24a8e255;border:1px solid #69d7fa;font-size:65px}.orb.active{animation:pulse 1.3s infinite alternate}@keyframes pulse{to{box-shadow:0 0 75px #5ce1ff;transform:scale(1.04)}}h1{letter-spacing:6px;margin:0}p{color:#aec6d7}button{cursor:pointer;color:white;background:#183a55;border:1px solid #416b85;border-radius:14px;padding:14px;font-size:15px}button:focus-visible,input:focus-visible{outline:2px solid #8ce7ff}.talk{border-radius:99px;background:#1977a6;font-weight:700;margin-top:12px;min-width:190px}#status{min-height:48px;font-size:14px;color:#b8d6e4;line-height:1.5}.input{display:flex;gap:8px;margin:20px 0}input[type=text]{min-width:0;flex:1;background:#102b40;border:1px solid #43657d;color:white;border-radius:12px;padding:13px;font-size:16px}.panel{background:#10273b;border:1px solid #2b506a;border-radius:20px;padding:16px}.panel h2{font-size:12px;letter-spacing:2px;color:#8cdaef;margin:0 0 12px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tools button{background:#1a3850}.answer{margin-top:15px;white-space:pre-wrap;line-height:1.5;color:#d4e9f6;min-height:40px}footer{margin-top:26px;letter-spacing:1px;font-size:11px}#preview{width:100%;max-height:250px;object-fit:contain;margin-top:12px;border-radius:12px}small{color:#91adbf}</style></head><body><main><header><span>TB / DEVICE 001</span><span>OS 0.2</span></header><section class="center"><div class="orb" id="orb" aria-hidden="true">◉</div><h1>BILL AI</h1><p>TrailBlazer engineering assistant</p><button class="talk" id="talk">🎙 Tap to speak</button><p id="status" role="status">Ready for a command.</p></section><form class="input" id="form"><input id="command" type="text" aria-label="Command" placeholder="Ask Bill or type a command" autocomplete="off"><button type="submit">Send</button></form><section class="panel"><h2>QUICK COMMANDS</h2><div class="tools"><button id="camera">📷 Camera</button><button id="photos">🖼 Photos</button><button id="lab">🛠 The Lab</button><button id="files">📁 Files</button></div><div class="answer" id="answer">Try “open camera”, “show photos”, “what time is it?”, or “open the lab”.</div><img id="preview" hidden alt="Selected photo"></section><footer><span>TRAILBLAZER LAB</span><span>LOCAL COMMAND MODE</span></footer><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><input id="photoInput" type="file" accept="image/*" hidden><input id="fileInput" type="file" hidden></main><script>
const $=id=>document.getElementById(id);let selectedURL=null;function say(t){$('answer').textContent=t;if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1;speechSynthesis.speak(u)}}function status(t){$('status').textContent=t}function fileAction(id){$(id).click()}$('camera').onclick=()=>fileAction('cameraInput');$('photos').onclick=()=>fileAction('photoInput');$('files').onclick=()=>fileAction('fileInput');$('lab').onclick=()=>say('The Lab is under construction. Printer controls will be added in a later version.');for(const id of ['cameraInput','photoInput','fileInput']){$(id).addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;say('Selected '+f.name+'. This stays on your device; nothing is uploaded.');if(selectedURL)URL.revokeObjectURL(selectedURL);$('preview').hidden=!f.type.startsWith('image/');if(f.type.startsWith('image/')){selectedURL=URL.createObjectURL(f);$('preview').src=selectedURL}e.target.value=''})}function command(q){q=q.trim().toLowerCase();if(!q)return;if(q.includes('camera')||q.includes('picture')){say('Opening camera capture.');fileAction('cameraInput')}else if(q.includes('photo')||q.includes('media')){say('Choose a photo from your library.');fileAction('photoInput')}else if(q.includes('file')){say('Choose a file.');fileAction('fileInput')}else if(q.includes('lab')||q.includes('printer'))$('lab').click();else if(q.includes('time'))say('It is '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}));else if(q.includes('date'))say('Today is '+new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'}));else say('I heard: '+q+'. This prototype handles local commands only. Conversational AI needs a future model connection.')} $('form').onsubmit=e=>{e.preventDefault();const q=$('command').value;$('command').value='';command(q)};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let rec;try{rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.onstart=()=>{$('orb').classList.add('active');status('Listening…')};rec.onresult=e=>{const q=e.results[0][0].transcript;status('Heard: '+q);command(q)};rec.onerror=e=>status('Speech recognition unavailable ('+e.error+'). Use the text box.');rec.onend=()=>{$('orb').classList.remove('active')};$('talk').onclick=()=>{try{rec.start()}catch(e){status('Please try again or type your command.')}}}catch(e){$('talk').onclick=()=>status('Voice recognition is not available here. Use the text box.')}}else{$('talk').onclick=()=>status('Live speech recognition is not supported in this browser. Use the text box; voice will need a native app or a supported speech service.')} </script></body></html>
