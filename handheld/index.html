<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071421"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Bill AI | TrailBlazer</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#071421;color:#f2f8fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#153953 0,#071421 65%);min-height:100dvh}.app{max-width:780px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 15px env(safe-area-inset-bottom)}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:17px 3px;background:#0a1b2beF;backdrop-filter:blur(15px);border-bottom:1px solid #29445b}.orb{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#e0fcff 0 12%,#4bcaff 17%,#16628d 40%,#09263c 68%);border:1px solid #6bd9ff;box-shadow:0 0 20px #008ad155}h1{font-size:18px;margin:0;letter-spacing:2px}.sub{font-size:12px;color:#a4c4d5;margin-top:3px}.grow{flex:1}.pill{border:1px solid #38627b;border-radius:20px;padding:7px 10px;font-size:11px;color:#b8eaff;background:#122e44}.topbtn{background:transparent;color:#b9e6fa;border:1px solid #355c75;border-radius:12px;padding:9px;cursor:pointer}main{flex:1;overflow-y:auto;padding:20px 2px 16px;display:flex;flex-direction:column;gap:13px;min-height:200px}.msg{max-width:88%;border-radius:18px;padding:13px 15px;line-height:1.5;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}.bill{background:#142f44;border:1px solid #31536a;align-self:flex-start;border-bottom-left-radius:5px}.me{background:#166a9a;align-self:flex-end;border-bottom-right-radius:5px}.who{font-size:10px;letter-spacing:1.3px;color:#8bdcff;margin-bottom:5px;font-weight:700}.me .who{color:#d2f3ff}.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 13px}.chips button{white-space:nowrap;background:#15344b;border:1px solid #3b657e;color:#d7f1ff;border-radius:18px;padding:9px 13px;font-size:13px}.composer{position:sticky;bottom:0;background:#071421;padding:8px 0 13px;border-top:1px solid #2c4960;display:flex;gap:8px}textarea{flex:1;resize:none;min-height:48px;max-height:115px;background:#112c41;border:1px solid #3b6079;border-radius:15px;padding:13px;color:white;font:inherit;outline:none}textarea:focus{border-color:#75cfff}.send{background:#1884bd;border:1px solid #62c9fa;color:white;border-radius:14px;padding:0 17px;font-weight:700}.footer{font-size:10px;color:#86a9bc;text-align:center;padding:0 0 9px}.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:4}.sheet.open{display:flex}.modal{background:#102a3e;border:1px solid #47708a;border-radius:18px;padding:20px;width:min(100%,480px)}.modal h2{margin-top:0}.modal textarea{width:100%;min-height:140px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.actions button{border-radius:10px;padding:10px 14px;border:1px solid #54758a;background:#1a405b;color:white}.hint{color:#abc9da;font-size:13px;line-height:1.5}button{cursor:pointer}button:focus-visible{outline:2px solid #8be6ff}
</style></head><body><div class="app"><header><div class="orb" aria-hidden="true"></div><div><h1>BILL AI</h1><div class="sub">TrailBlazer Lab · Chat 0.4</div></div><div class="grow"></div><span class="pill">LOCAL CHAT</span><button class="topbtn" id="notesBtn" title="Project notes">📝</button><button class="topbtn" id="menuBtn" title="Chat options">⋯</button></header><main id="messages" aria-live="polite"></main><div class="chips"><button data-prompt="Help me plan a 3D printing project">🛠️ Project</button><button data-prompt="Show my project notes">📝 Notes</button><button data-prompt="What can you do offline?">🧠 Offline</button><button data-prompt="Help me calculate a measurement">📐 Calculate</button></div><form class="composer" id="chatForm"><textarea id="input" rows="1" placeholder="Message Bill…" aria-label="Message Bill"></textarea><button class="send" type="submit">Send ↑</button></form><div class="footer">LOCAL COMMAND ASSISTANT · AI MODEL NOT CONNECTED</div></div><div class="sheet" id="notesSheet"><div class="modal"><h2>TrailBlazer Project Notes</h2><p class="hint">Saved only in this browser on this device. Avoid storing secrets.</p><textarea id="notesInput" placeholder="Design measurements, print settings, project ideas…"></textarea><div class="actions"><button id="closeNotes">Cancel</button><button id="saveNotes">Save notes</button></div></div></div><div class="sheet" id="menuSheet"><div class="modal"><h2>Chat Options</h2><p class="hint">Your chat history is stored locally on this device. It is not synced to your other phone.</p><div class="actions" style="flex-wrap:wrap"><button id="exportChat">Export chat</button><button id="clearChat">Clear chat</button><button id="closeMenu">Close</button></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='trailblazer-bill-chat-v04',NOTE='trailblazer-bill-notes-v04';let history=[];try{history=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(history))history=[]}catch(e){history=[]}const welcome='Welcome to TrailBlazer Lab. I’m Bill, your local command assistant. This chat saves messages on your phone, but a conversational AI model is not connected yet. Try “time”, “date”, “calculate 12 * 4”, or open Project Notes.';function draw(){const area=$('messages');area.textContent='';if(!history.length){const m=document.createElement('div');m.className='msg bill';m.textContent=welcome;area.append(m)}for(const x of history){const m=document.createElement('div');m.className='msg '+(x.role==='user'?'me':'bill');const who=document.createElement('div');who.className='who';who.textContent=x.role==='user'?'YOU':'BILL AI';const t=document.createElement('div');t.textContent=x.text;m.append(who,t);area.append(m)}area.scrollTop=area.scrollHeight}function save(){try{localStorage.setItem(KEY,JSON.stringify(history.slice(-120)))}catch(e){}}function reply(s){const q=s.toLowerCase().trim();if(/\b(notes|project notes)\b/.test(q)){const n=localStorage.getItem(NOTE)||'';return n?'Your saved notes:\n'+n:'You have no project notes yet. Tap the 📝 button to add some.'}if(/\b(time|clock)\b/.test(q))return 'Local time: '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});if(/\b(date|today)\b/.test(q))return 'Today is '+new Date().toLocaleDateString([],{weekday:'long',year:'numeric',month:'long',day:'numeric'});if(/\b(offline|model|ai)\b/.test(q))return 'This interface and your saved messages can work offline after caching, but a language model is not connected. Your MLC Chat model runs separately; this website cannot read it.';const calc=q.match(/(?:calculate|what is|compute)\s+(-?\d+(?:\.\d+)?)\s*([+*×x\/÷-])\s*(-?\d+(?:\.\d+)?)/);if(calc){const a=Number(calc[1]),b=Number(calc[3]),op=calc[2];if((op==='/'||op==='÷')&&b===0)return 'Cannot divide by zero.';const v=op==='+'?a+b:op==='-'?a-b:op==='*'||op==='×'||op==='x'?a*b:a/b;return `${a} ${op} ${b} = ${Number(v.toPrecision(12))}. Check critical engineering dimensions independently.`}if(/\b(hello|hi|hey)\b/.test(q))return 'Hello! Bill is ready. I can save your messages, show project notes, tell the time/date, and calculate basic arithmetic.';if(/\b(project|shapr|printer|design|cad|stand|dock)\b/.test(q))return 'Let’s capture your design idea. What are you making, what dimensions do you know, and what material will you print with? I can save our discussion, but detailed AI design advice requires connecting a model.';return 'Message saved. I don’t have a conversational AI model connected yet, so I can only answer supported local commands. Try “calculate 25 * 4”, “time”, “date”, or “show my project notes”.'}function submit(s){s=s.trim();if(!s)return;history.push({role:'user',text:s},{role:'assistant',text:reply(s)});save();draw()}$('chatForm').addEventListener('submit',e=>{e.preventDefault();const s=$('input').value;$('input').value='';submit(s)});$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('chatForm').requestSubmit()}});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>submit(b.dataset.prompt)));function show(id,on){$(id).classList.toggle('open',on)}$('notesBtn').onclick=()=>{$('notesInput').value=localStorage.getItem(NOTE)||'';show('notesSheet',true)};$('closeNotes').onclick=()=>show('notesSheet',false);$('saveNotes').onclick=()=>{try{localStorage.setItem(NOTE,$('notesInput').value);show('notesSheet',false);submit('Show my project notes')}catch(e){alert('Could not save notes on this device.')}};$('menuBtn').onclick=()=>show('menuSheet',true);$('closeMenu').onclick=()=>show('menuSheet',false);$('clearChat').onclick=()=>{if(confirm('Delete the saved chat on this device?')){history=[];save();draw();show('menuSheet',false)}};$('exportChat').onclick=()=>{const data=history.map(x=>(x.role==='user'?'YOU':'BILL')+': '+x.text).join('\n\n');const blob=new Blob([data||'No messages'],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TrailBlazer-Bill-Chat.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script></body></html>
